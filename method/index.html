<main><div class="intro"><p class="eyebrow">產業 · 公司 · 研究</p><h1>觀察變化。<br><span>理解循環。</span></h1><p>從資料出發，建立觀點。<br>每一次判斷，都留有驗證的空間。</p></div>

  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  // Save only a successfully authenticated derived key, never the password.
  try {
    const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
    const encoded = btoa(String.fromCharCode(...raw));
    try { sessionStorage.setItem("k:" + S, encoded); } catch (_) {}
    if (remember === true) { try { localStorage.setItem("k:" + S, encoded); } catch (_) {} }
    if (remember === false) { try { localStorage.removeItem("k:" + S); } catch (_) {} }
  } catch (_) {}
  document.open(); document.write(html); document.close();
}
