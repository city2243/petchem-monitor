<main><div class="intro"><p class="eyebrow">產業 · 公司 · 研究</p><h1>觀察變化。<br><span>理解循環。</span></h1><p>從資料出發，建立觀點。<br>每一次判斷，都留有驗證的空間。</p></div>

    const key = await keyFrom(document.getElementById("pw").value);
    await open(key, document.getElementById("rem").checked);
  } catch (e) { err.textContent = "密碼不對，請再試一次。"; go.disabled = false; go.textContent = "開啟研究"; }
};
</script></body></html>
