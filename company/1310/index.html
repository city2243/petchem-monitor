<header class="top">石化研究<span>．</span></header>
<main><div class="intro"><p class="eyebrow">產業 · 公司 · 研究</p><h1>觀察變化。<br><span>理解循環。</span></h1><p>從資料出發，建立觀點。<br>每一次判斷，都留有驗證的空間。</p></div>
<form id="f"><div class="lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg></div><h2>開啟研究空間</h2><p>輸入存取密碼，繼續閱讀。</p><label class="password-label" for="pw">存取密碼</label>
