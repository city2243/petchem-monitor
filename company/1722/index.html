<header class="top">石化研究<span>．</span></header>
<main><div class="intro"><p class="eyebrow">產業 · 公司 · 研究</p><h1>觀察變化。<br><span>理解循環。</span></h1><p>從資料出發，建立觀點。<br>每一次判斷，都留有驗證的空間。</p></div>
